sdoh_pulse:
  target: dev
  outputs:
    dev:
      type: bigquery
      # No service-account keyfile: this org's policy blocks key creation
      # (iam.disableServiceAccountKeyCreation). oauth uses your own gcloud
      # Application Default Credentials instead — run
      # `gcloud auth application-default login` once before `dbt` commands.
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: main
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      # Safety cap for a free-tier project: fail loud on a runaway query
      # instead of quietly burning the monthly free quota.
      maximum_bytes_billed: 1000000000
