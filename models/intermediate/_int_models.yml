version: 2

models:
  - name: int_county_annual_sdoh
    description: >
      Central spine: one row per county per year (2016–2022) with all SDOH
      dimensions joined. AHRQ columns are null when files have not been
      downloaded; all other joins are required.
    columns:
      - name: county_fips
        tests:
          - not_null

      - name: year
        tests:
          - not_null

  - name: int_policy_era_assignments
    description: >
      Extends int_county_annual_sdoh with era_name (Trump1/Biden/Trump2) and a
      policy_event_label for significant federal policy changes within the study
      window.
    columns:
      - name: era_name
        description: Trump1, Biden, or Trump2
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Trump1', 'Biden', 'Trump2']

  - name: int_medicaid_exposure
    description: >
      Adds Medicaid expansion status, expansion year, years_since_expansion,
      and expansion_phase to every county-year row. This is the final
      intermediate model consumed by all mart models.
    columns:
      - name: is_expansion_state
        tests:
          - not_null

      - name: expansion_phase
        tests:
          - not_null

          - accepted_values:
              arguments:
                values:
                  - never_expanded
                  - pre_expansion
                  - expansion_year
                  - post_expansion
