version: 2

models:
  - name: int_county_annual_clh
    description: >
      Central spine: one row per county per year (2017–2022), the SAHIE
      uninsurance model left-joined with BLS unemployment, ACS
      socioeconomic data, AHRQ healthcare infrastructure, and the state
      FIPS lookup seed. SAHIE defines county × year coverage; AHRQ columns
      are null whenever the AHRQ Excel files have not been downloaded, all
      other joins are expected to be complete.
    columns:
      - name: county_year_key
        data_type: string
        description: >
          Surrogate key hashed from (county_fips, year), inherited from
          stg_sahie__county_uninsured. Primary key of this model.
        data_tests:
          - not_null
          - unique

      - name: county_fips
        data_type: string
        description: 5-digit county FIPS code.
        data_tests:
          - not_null

      - name: state_fips
        data_type: string
        description: 2-digit state FIPS code.

      - name: county_name
        data_type: string
        description: County name as reported by SAHIE.

      - name: state_name
        data_type: string
        description: Full state name, joined from the state_fips_lookup seed.

      - name: state_abbr
        data_type: string
        description: 2-letter state postal abbreviation, joined from the state_fips_lookup seed.

      - name: census_region
        data_type: string
        description: >
          Census Bureau region (Northeast, Midwest, South, West), joined
          from the state_fips_lookup seed.

      - name: census_division
        data_type: string
        description: >
          Census Bureau division (e.g. East South Central, Pacific), joined
          from the state_fips_lookup seed.

      - name: year
        data_type: int64
        description: Calendar year of the observation.
        data_tests:
          - not_null

      - name: pct_uninsured
        data_type: float64
        description: >
          Share of the population without health insurance (0–1 scale).
          Null for suppressed small counties.

      - name: n_uninsured
        data_type: float64
        description: Estimated count of uninsured people (from SAHIE).

      - name: n_insured
        data_type: float64
        description: Estimated count of insured people (from SAHIE).

      - name: sahie_total_population
        data_type: float64
        description: Derived total population (n_uninsured + n_insured).

      - name: unemployment_rate
        data_type: float64
        description: >
          Annual average unemployment rate (percent, 0–100 scale), from
          BLS LAUS. Null if no BLS match for the county-year.

      - name: median_household_income
        data_type: float64
        description: >
          Median household income in dollars, from ACS. Null if no ACS
          match for the county-year.

      - name: poverty_rate
        data_type: float64
        description: >
          Share of population below the federal poverty line (0–1 scale),
          from ACS.

      - name: pct_bachelors_plus
        data_type: float64
        description: >
          Share of the adult population with a bachelor's degree or higher
          (0–1 scale), from ACS.

      - name: pct_hs_plus
        data_type: float64
        description: >
          Share of the adult population with a high school diploma or
          higher (0–1 scale), from ACS.

      - name: pct_severe_rent_burden
        data_type: float64
        description: >
          Share of renter households spending 50%+ of income on rent
          (0–1 scale), from ACS.

      - name: dist_trauma_center_miles
        data_type: float64
        description: >
          Distance from the county centroid to the nearest trauma center,
          in miles, from AHRQ. Null when AHRQ files have not been
          downloaded.

      - name: mds_rate_per_100k
        data_type: float64
        description: >
          Rate of physicians (MDs) per 100,000 population, from AHRQ. Null
          when AHRQ files have not been downloaded.

      - name: rural_urban_code_2013
        data_type: int64
        description: >
          USDA 2013 Rural-Urban Continuum Code (RUCC), from AHRQ. Null
          when AHRQ files have not been downloaded.

      - name: is_rural
        data_type: bool
        description: >
          Boolean rurality flag derived from rural_urban_code_2013. Null
          when AHRQ files have not been downloaded.

  - name: int_policy_era_assignments
    description: >
      Extends int_county_annual_clh with era_name (Trump1/Biden/Trump2),
      president, era_color_hex (from the policy_eras seed), and a
      policy_event_label annotating significant federal policy changes
      within the study window. Adds one row per calendar year worth of
      new columns onto the spine; row count is unchanged from
      int_county_annual_clh.
    columns:
      - name: county_year_key
        data_type: string
        description: >
          Surrogate key hashed from (county_fips, year), inherited from
          the spine. Primary key of this model.
        data_tests:
          - not_null
          - unique

      - name: county_fips
        data_type: string
        description: 5-digit county FIPS code.
        data_tests:
          - not_null

      - name: state_fips
        data_type: string
        description: 2-digit state FIPS code.

      - name: county_name
        data_type: string
        description: County name as reported by SAHIE.

      - name: state_name
        data_type: string
        description: Full state name.

      - name: state_abbr
        data_type: string
        description: 2-letter state postal abbreviation.

      - name: census_region
        data_type: string
        description: Census Bureau region.

      - name: census_division
        data_type: string
        description: Census Bureau division.

      - name: year
        data_type: int64
        description: Calendar year of the observation.
        data_tests:
          - not_null

      - name: pct_uninsured
        data_type: float64
        description: Share of the population without health insurance (0–1 scale).

      - name: n_uninsured
        data_type: float64
        description: Estimated count of uninsured people.

      - name: n_insured
        data_type: float64
        description: Estimated count of insured people.

      - name: sahie_total_population
        data_type: float64
        description: Derived total population (n_uninsured + n_insured).

      - name: unemployment_rate
        data_type: float64
        description: Annual average unemployment rate (percent, 0–100 scale).

      - name: median_household_income
        data_type: float64
        description: Median household income in dollars.

      - name: poverty_rate
        data_type: float64
        description: Share of population below the federal poverty line (0–1 scale).

      - name: pct_bachelors_plus
        data_type: float64
        description: Share of adults with a bachelor's degree or higher (0–1 scale).

      - name: pct_hs_plus
        data_type: float64
        description: Share of adults with a high school diploma or higher (0–1 scale).

      - name: pct_severe_rent_burden
        data_type: float64
        description: Share of renter households with severe rent burden (0–1 scale).

      - name: dist_trauma_center_miles
        data_type: float64
        description: Distance to nearest trauma center, in miles.

      - name: mds_rate_per_100k
        data_type: float64
        description: Rate of physicians (MDs) per 100,000 population.

      - name: rural_urban_code_2013
        data_type: int64
        description: USDA 2013 Rural-Urban Continuum Code (RUCC).

      - name: is_rural
        data_type: bool
        description: Boolean rurality flag derived from rural_urban_code_2013.

      - name: era_name
        data_type: string
        description: >
          Political era label the year falls into, from the policy_eras
          seed. One of Trump1 (2017–2020), Biden (2021–2024), or Trump2
          (2025+). Null for years outside the seed's defined ranges.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Trump1', 'Biden', 'Trump2']
              config:
                where: "era_name is not null"

      - name: president
        data_type: string
        description: President in office during era_name, from the policy_eras seed.

      - name: era_color_hex
        data_type: string
        description: >
          Hex color code assigned to era_name for consistent chart styling,
          from the policy_eras seed.

      - name: policy_event_label
        data_type: string
        description: >
          Free-text label for a significant federal policy change that
          occurred in this calendar year (e.g. ACA mandate repeal, Medicaid
          unwinding). Null for years with no flagged event.

  - name: int_medicaid_exposure
    description: >
      Adds Medicaid expansion status, expansion year, years_since_expansion,
      and expansion_phase to every county-year row, joined from the
      medicaid_expansion_status seed on state_fips. This is the final
      intermediate model and is consumed by all mart models. Row count is
      unchanged from int_policy_era_assignments.
    columns:
      - name: county_year_key
        data_type: string
        description: >
          Surrogate key hashed from (county_fips, year). Primary key of
          this model.
        data_tests:
          - not_null
          - unique

      - name: county_fips
        data_type: string
        description: 5-digit county FIPS code.
        data_tests:
          - not_null

      - name: state_fips
        data_type: string
        description: 2-digit state FIPS code.

      - name: county_name
        data_type: string
        description: County name as reported by SAHIE.

      - name: state_name
        data_type: string
        description: Full state name.

      - name: state_abbr
        data_type: string
        description: 2-letter state postal abbreviation.

      - name: census_region
        data_type: string
        description: Census Bureau region.

      - name: census_division
        data_type: string
        description: Census Bureau division.

      - name: year
        data_type: int64
        description: Calendar year of the observation.
        data_tests:
          - not_null

      - name: pct_uninsured
        data_type: float64
        description: Share of the population without health insurance (0–1 scale).

      - name: n_uninsured
        data_type: float64
        description: Estimated count of uninsured people.

      - name: n_insured
        data_type: float64
        description: Estimated count of insured people.

      - name: sahie_total_population
        data_type: float64
        description: Derived total population (n_uninsured + n_insured).

      - name: unemployment_rate
        data_type: float64
        description: Annual average unemployment rate (percent, 0–100 scale).

      - name: median_household_income
        data_type: float64
        description: Median household income in dollars.

      - name: poverty_rate
        data_type: float64
        description: Share of population below the federal poverty line (0–1 scale).

      - name: pct_bachelors_plus
        data_type: float64
        description: Share of adults with a bachelor's degree or higher (0–1 scale).

      - name: pct_hs_plus
        data_type: float64
        description: Share of adults with a high school diploma or higher (0–1 scale).

      - name: pct_severe_rent_burden
        data_type: float64
        description: Share of renter households with severe rent burden (0–1 scale).

      - name: dist_trauma_center_miles
        data_type: float64
        description: Distance to nearest trauma center, in miles.

      - name: mds_rate_per_100k
        data_type: float64
        description: Rate of physicians (MDs) per 100,000 population.

      - name: rural_urban_code_2013
        data_type: int64
        description: USDA 2013 Rural-Urban Continuum Code (RUCC).

      - name: is_rural
        data_type: bool
        description: Boolean rurality flag derived from rural_urban_code_2013.

      - name: era_name
        data_type: string
        description: Political era label (Trump1/Biden/Trump2).

      - name: president
        data_type: string
        description: President in office during era_name.

      - name: era_color_hex
        data_type: string
        description: Hex color code assigned to era_name for chart styling.

      - name: policy_event_label
        data_type: string
        description: Free-text label for a significant federal policy change in this year.

      - name: expansion_status
        data_type: string
        description: >
          State-level Medicaid expansion status from the
          medicaid_expansion_status seed: 'expanded' or 'not_expanded'.

      - name: expansion_year
        data_type: int64
        description: >
          Calendar year the state adopted ACA Medicaid expansion. Null for
          non-expansion states.

      - name: is_expansion_state
        data_type: bool
        description: >
          Boolean version of expansion_status: true when expansion_status
          = 'expanded', false otherwise. Used as the treatment indicator
          in the diff-in-diff analysis.
        data_tests:
          - not_null

      - name: years_since_expansion
        data_type: int64
        description: >
          Number of years since the state adopted Medicaid expansion at
          the time of this observation (0 in the expansion year itself).
          Null for non-expansion states and for years before the state's
          expansion year.

      - name: expansion_phase
        data_type: string
        description: >
          Categorical phase relative to Medicaid expansion: never_expanded
          (state has not expanded), pre_expansion (before the state's
          expansion year), expansion_year (the year expansion took
          effect), or post_expansion (after expansion).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - never_expanded
                  - pre_expansion
                  - expansion_year
                  - post_expansion
