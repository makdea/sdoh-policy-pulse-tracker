version: 2

models:
  - name: mart_county_sdoh_trends
    description: >
      Final wide table: one row per county per year (2017–2022). Primary
      mart for the choropleth map and county drill-down dashboard panels.
      Built directly from int_medicaid_exposure with no additional
      filtering — includes all SDOH dimensions, era labels, Medicaid
      exposure, and a composite disadvantage index. Materialized as a
      table for dashboard query performance.
    columns:
      - name: county_fips
        description: 5-digit county FIPS code.
        data_tests:
          - not_null

      - name: state_fips
        description: 2-digit state FIPS code.

      - name: county_name
        description: County name as reported by SAHIE.

      - name: state_name
        description: Full state name.

      - name: state_abbr
        description: 2-letter state postal abbreviation.

      - name: census_region
        description: Census Bureau region (Northeast, Midwest, South, West).

      - name: census_division
        description: Census Bureau division (e.g. East South Central, Pacific).

      - name: year
        description: Calendar year of the observation.
        data_tests:
          - not_null

      - name: era_name
        description: Political era label (Trump1, Biden, or Trump2) for the year.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Trump1', 'Biden', 'Trump2']

      - name: president
        description: President in office during era_name.

      - name: era_color_hex
        description: Hex color code assigned to era_name for consistent chart styling.

      - name: policy_event_label
        description: >
          Free-text label for a significant federal policy change in this
          calendar year (e.g. ACA mandate repeal, Medicaid unwinding).
          Null for years with no flagged event.

      - name: expansion_status
        description: State-level Medicaid expansion status ('expanded' or 'not_expanded').

      - name: expansion_year
        description: >
          Calendar year the state adopted ACA Medicaid expansion. Null
          for non-expansion states.

      - name: is_expansion_state
        description: >
          Boolean treatment indicator: true for Medicaid expansion states,
          false otherwise.

      - name: years_since_expansion
        description: >
          Years since the state adopted Medicaid expansion (0 in the
          expansion year). Null for non-expansion states and
          pre-expansion years.

      - name: expansion_phase
        description: >
          Categorical phase relative to Medicaid expansion: never_expanded,
          pre_expansion, expansion_year, or post_expansion.

      - name: pct_uninsured
        description: >
          Percent uninsured (0–1 scale), from SAHIE. Null for suppressed
          small counties.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "pct_uninsured is not null"

      - name: n_uninsured
        description: Estimated count of uninsured people.

      - name: n_insured
        description: Estimated count of insured people.

      - name: sahie_total_population
        description: Derived total population (n_uninsured + n_insured).

      - name: unemployment_rate
        description: Annual average unemployment rate (percent, 0–100 scale).

      - name: median_household_income
        description: Median household income in dollars.

      - name: poverty_rate
        description: Share of population below the federal poverty line (0–1 scale).

      - name: pct_bachelors_plus
        description: Share of adults with a bachelor's degree or higher (0–1 scale).

      - name: pct_hs_plus
        description: Share of adults with a high school diploma or higher (0–1 scale).

      - name: pct_severe_rent_burden
        description: Share of renter households with severe rent burden (0–1 scale).

      - name: dist_trauma_center_miles
        description: >
          Distance from the county centroid to the nearest trauma center,
          in miles. Null without AHRQ files loaded.

      - name: mds_rate_per_100k
        description: >
          Rate of physicians (MDs) per 100,000 population. Null without
          AHRQ files loaded.

      - name: is_rural
        description: >
          Boolean rurality flag (RUCC 4–9 = rural). Null without AHRQ
          files loaded.

      - name: rural_urban_code_2013
        description: >
          USDA 2013 Rural-Urban Continuum Code (RUCC). Null without AHRQ
          files loaded.

      - name: sdoh_disadvantage_index
        description: >
          Composite disadvantage score: the mean of z-scored
          pct_uninsured, poverty_rate, and unemployment_rate across the
          full table (window functions with no partitioning). Higher
          values indicate more disadvantage. Null whenever any of the
          three component columns is null for that row.

  - name: mart_era_comparisons
    description: >
      Era × expansion-status × census-region aggregate table, built from
      int_medicaid_exposure filtered to rows with a non-null era_name.
      Powers the era comparison bar chart and regional breakdown panels.
      One row per unique combination of era_name, is_expansion_state,
      expansion_status, and census_region.
    columns:
      - name: era_name
        description: Political era label (Trump1, Biden, or Trump2).
        data_tests:
          - not_null

      - name: president
        description: President in office during era_name.

      - name: era_color_hex
        description: Hex color code assigned to era_name for consistent chart styling.

      - name: is_expansion_state
        description: Boolean grouping key — true for Medicaid expansion states.

      - name: expansion_status
        description: State-level Medicaid expansion status ('expanded' or 'not_expanded').

      - name: census_region
        description: Census Bureau region (Northeast, Midwest, South, West).

      - name: n_counties
        description: Distinct county count within this era/expansion/region cell.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 3200

      - name: n_county_years
        description: >
          Total county-year row count within this cell (n_counties summed
          across the years spanned by the era).

      - name: avg_pct_uninsured
        description: Mean pct_uninsured across all county-years in this cell.

      - name: median_pct_uninsured
        description: Median pct_uninsured across all county-years in this cell.

      - name: sd_pct_uninsured
        description: Standard deviation of pct_uninsured across this cell.

      - name: avg_unemployment_rate
        description: Mean unemployment_rate across all county-years in this cell.

      - name: median_unemployment_rate
        description: Median unemployment_rate across all county-years in this cell.

      - name: avg_poverty_rate
        description: Mean poverty_rate across all county-years in this cell.

      - name: median_poverty_rate
        description: Median poverty_rate across all county-years in this cell.

      - name: avg_median_hh_income
        description: Mean of median_household_income across all county-years in this cell.

      - name: avg_pct_bachelors_plus
        description: Mean pct_bachelors_plus across all county-years in this cell.

      - name: avg_pct_severe_rent_burden
        description: Mean pct_severe_rent_burden across all county-years in this cell.

      - name: era_start_year
        description: Earliest calendar year observed in this cell (bounded by data availability).

      - name: era_end_year
        description: Latest calendar year observed in this cell (bounded by data availability).

      - name: era_sort_order
        description: >
          Integer sort key for consistent chart ordering: 1 = Trump1,
          2 = Biden, 3 = Trump2.

  - name: mart_diff_in_diff
    description: >
      2×2 difference-in-differences estimates comparing expansion vs
      non-expansion states across the Trump1→Biden era transition, for
      four outcomes (pct_uninsured, unemployment_rate, poverty_rate,
      median_household_income). One row per outcome (4 rows total).
      NOTE: this model has known methodological caveats (see comments in
      mart_diff_in_diff.sql) — it averages county-level rates unweighted
      by population, and takes max() rather than an aggregate when
      pivoting era values, so a single outlier can swing the estimate.
      It is currently left out of the dashboard for this reason.
      did_estimate < 0 on pct_uninsured means expansion states improved
      more (larger decrease in uninsurance) than non-expansion states.
    columns:
      - name: outcome
        description: >
          Name of the outcome variable this row's DiD estimate applies to.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pct_uninsured
                  - unemployment_rate
                  - poverty_rate
                  - median_household_income

      - name: treated_pre
        description: >
          Average value of `outcome` for expansion states during the
          Trump1 era (pre-period).

      - name: treated_post
        description: >
          Average value of `outcome` for expansion states during the
          Biden era (post-period).

      - name: control_pre
        description: >
          Average value of `outcome` for non-expansion states during the
          Trump1 era (pre-period).

      - name: control_post
        description: >
          Average value of `outcome` for non-expansion states during the
          Biden era (post-period).

      - name: treated_change
        description: treated_post − treated_pre.

      - name: control_change
        description: control_post − control_pre.

      - name: did_estimate
        description: >
          The difference-in-differences estimate: treated_change −
          control_change, in the outcome's native units/scale.
        data_tests:
          - not_null

      - name: n_treated_counties
        description: Distinct count of expansion-state counties contributing to this estimate.

      - name: n_control_counties
        description: Distinct count of non-expansion-state counties contributing to this estimate.

      - name: interpretation_note
        description: >
          Human-readable guidance on how to read the sign of did_estimate
          for this outcome (e.g. "lower is better — negative DiD favors
          expansion states").

      - name: did_estimate_pct_pts
        description: did_estimate rescaled to percentage points (did_estimate * 100), rounded to 2 decimals.
